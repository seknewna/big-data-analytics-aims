# Course lab environment: JupyterLab + PySpark (+ optional Kafka for Chapter 9)
#   docker compose up                    -> notebook only
#   docker compose --profile kafka up    -> notebook + Kafka
services:
  notebook:
    image: quay.io/jupyter/pyspark-notebook:latest   # pin a dated tag for a whole cohort, e.g. :2026-01-05
    ports:
      - "8888:8888"   # JupyterLab
      - "4040:4040"   # Spark UI
      - "8787:8787"   # Dask dashboard
    volumes:
      - ./:/home/jovyan/work
    environment:
      - PIP_EXTRA=polars duckdb dask[complete] h3 geopandas xarray rioxarray faker deltalake confluent-kafka
    command: >
      bash -c "pip install -q $${PIP_EXTRA} && start-notebook.py --ServerApp.root_dir=/home/jovyan/work"

  kafka:
    image: apache/kafka:latest
    profiles: ["kafka"]
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 3
# From inside the notebook container use bootstrap server kafka:29092; from your host use localhost:9092.
